[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=. --cov-report=term-missing --cov-fail-under=70
markers =
    integration: integration tests requiring DB/exchange
    unit: pure unit tests (default, no markers needed)
